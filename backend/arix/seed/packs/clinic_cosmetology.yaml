# Cosmetology clinic template (ТЗ §11).
meta:
  code: clinic_cosmetology
  vertical: clinic
  title: Косметология
  rubrics: [косметология, косметологическая клиника, эстетическая медицина, cosmetology, дерматология]

config:
  currency: KZT
  quiet_hours: "21:00-09:00"
  owner_report_at: "08:00"
  working_hours:
    mon-sat: "09:00-20:00"
    sun: "off"
  agent:
    tone: коротко, тепло, по делу; без канцелярита и эмодзи-спама
    slots_to_offer: 3
    max_confusion: 2
  features:
    followup: true
    recall: true
    reviews: true
    waitlist: false
    miniapp_payments: false
    treatment_plans: false
    voice_stt: true
    doctor_bot: true
  reminders:
    visit_offsets_h: [-24, -2]
    call_task_before_h: 3
    early_morning_send_at: "08:00"
  followup:
    offsets_h: [1, 24, 72]
    max_touches: 3
  recall:
    lead_days: 7
    dormant_months_from: 9
    dormant_months_to: 12
  reviews:
    delay_h: 2
    promote_from_score: 5
    alert_up_to_score: 3
  handoff:
    pickup_minutes: 10
    escalate_minutes: 30
  red_flags:
    ru: [сильное жжение после процедуры, отек после инъекции, аллергическая реакция, гнойник, кожа побелела]

